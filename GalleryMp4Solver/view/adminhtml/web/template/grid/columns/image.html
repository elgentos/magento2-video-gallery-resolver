<!--
/**
 * Copy of Magento_MediaGalleryUi::template/grid/columns/image.html, mapped in over the original by
 * view/adminhtml/requirejs-config.js.
 *
 * The only change is the tile itself. Core renders one <img> pointing at a .thumbs file, which
 * never exists for a video. A video row instead shows its captured poster, or falls back to a
 * <video> with #t=0.5 on the source, which paints the frame half a second in rather than a black
 * rectangle, and captures that frame as the poster (see js/grid/columns/image-mixin.js). Core's own
 * <img> is kept, hidden, because deleteImages.js reads its src.
 */
-->
<div class="media-gallery-wrap" collapsible>
  <div class="mediagallery-massaction-checkbox" if="isMassActionMode()">
      <input type="checkbox" attr="{ 'data-ui-id': $row().title }" visible="isMassActionMode()" ko-checked="isSelected($row())" click="function () { return select($row()); }"/>
  </div>
    <div class="media-gallery-image">
        <div data-row="file"
             class="masonry-image-block media-gallery-image-block"
             attr="'data-id': $col.getId($row())"
             css="{ selected: isSelected($row()) }"
             click="function(){ clickOnImage($row(), $collapsible.opened()) }"
        >
            <!--
              Video rows keep core's thumbnail image in the DOM but hidden, because
              deleteImages.js reads its src to work out which file to delete. loading="lazy" on a
              display:none element means the browser never actually requests it, so the missing
              .thumbs file costs nothing.
            -->
            <img if="$row().video_url"
                 attr="src: $col.getUrl($row())"
                 loading="lazy"
                 style="display:none"/>
            <img if="$row().video_url && $row().video_poster_url"
                 attr="src: $row().video_poster_url, alt: $col.getImageAlt($row())"
                 class="media-gallery-image-column"
                 data-role="thumbnail"/>
            <video if="$row().video_url && !$row().video_poster_url"
                   attr="src: $row().video_url + '#t=0.5'"
                   class="media-gallery-image-column"
                   preload="metadata"
                   muted
                   playsinline
                   data-bind="event: { loadeddata: function (data, event) { $col.captureVideoPoster($row(), event); } }"
                   data-role="thumbnail"></video>
            <img ifnot="$row().video_url"
                 attr="src: $col.getUrl($row()), alt: $col.getImageAlt($row())"
                 class="media-gallery-image-column"
                 data-role="thumbnail"/>
        </div>
        <ul class="action-menu" css="_active: $collapsible.opened">
            <scope args="actions">
                <render args="template"></render>
            </scope>
        </ul>
    </div>
    <div class="masonry-image-description">
        <ul class="media-gallery-image-details">
            <li class="name" data-ui-id="title" text="$row().title"></li>
            <li class="source">
                <img if="$row().source" class="media-gallery-source-icon" attr="{ src: $row().source }"/>
            </li>
            <li class="type" data-ui-id="content-type" text="$row().content_type"></li> &#8226;
            <li class="dimensions" data-ui-id="dimensions" text="$row().width + 'x' + $row().height"></li>
        </ul>
        <div class="media-gallery-image-actions">
            <div class="action-select-wrap">
                <span class="three-dots" ifnot="isMassActionMode()"
                      toggleCollapsible
                      click="function () { clickOnThreeDots($row(), $collapsible.opened()); }"></span>
            </div>
        </div>
    </div>
</div>
